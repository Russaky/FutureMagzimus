[platformio]
default_envs = progressbar

[env]
platform      = espressif32
framework     = arduino
monitor_speed = 115200
lib_deps =
    fastled/FastLED@^3.7.0
build_flags =
    -D GROUP_ID=1

[env:progressbar]
board = esp32-c3-devkitm-1
build_flags =
    ${env.build_flags}
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D OTA_HOSTNAME='"progressbar-c3"'

[env:progressbar-ota]
board = esp32-c3-devkitm-1
upload_protocol = espota
upload_port = progressbar-c3.local
build_flags =
    ${env:progressbar.build_flags}

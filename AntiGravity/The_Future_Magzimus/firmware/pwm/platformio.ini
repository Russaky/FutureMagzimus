[platformio]
default_envs = pwm

[env]
platform      = espressif32
framework     = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
    -D GROUP_ID=1

[env:pwm]
board = esp32dev

[env:pwm-c3]
board = esp32-c3-devkitm-1
build_flags =
    ${env.build_flags}
    -D ESP32_C3
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

[env:pwm-s3]
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -D ESP32_S3
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

; GPIO scan — diagnostic only, identifies which pins light the LEDs
[env:gpio-scan]
board = esp32-c3-devkitm-1
build_flags =
    -D GROUP_ID=1
    -D ESP32_C3
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D GPIO_SCAN

; Light Nodes — one env per physical C3 node, NODE_ID fixed at compile time
[env:node-c3-1]
extends = env:pwm-c3
build_flags = ${env:pwm-c3.build_flags} -D NODE_ID=1

[env:node-c3-2]
extends = env:pwm-c3
build_flags = ${env:pwm-c3.build_flags} -D NODE_ID=2

[env:node-c3-3]
extends = env:pwm-c3
build_flags = ${env:pwm-c3.build_flags} -D NODE_ID=3

[env:node-c3-4]
extends = env:pwm-c3
build_flags = ${env:pwm-c3.build_flags} -D NODE_ID=4

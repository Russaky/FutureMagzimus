[platformio]
default_envs = bridge-c3

[env]
platform      = espressif32
framework     = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
    -D GROUP_ID=1

[env:bridge-c3]
board = esp32-c3-devkitm-1
build_flags =
    ${env.build_flags}
    -D ESP32_C3
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1

[env:bridge-s2]
board = lolin_s2_mini
build_flags =
    ${env.build_flags}
    -D ESP32_S2
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1

[env:bridge-s3]
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -D ESP32_S3
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
